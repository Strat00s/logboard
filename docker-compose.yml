# logboard — docker-compose / podman-compose service
#
# start:  LB_TOKEN=s3cret docker compose up -d      (or: podman-compose up -d)
# logs:   docker compose logs -f
# stop:   docker compose down        (data survives in the named volume)
#
# The database lives in the `lb_data` volume at /app/data. Delete the volume
# (`docker compose down -v`) only if you want to wipe the board.
# Point LB_HOST at 127.0.0.1-style privacy by publishing the port to
# loopback only: "127.0.0.1:8421:8421" below.

services:
  logboard:
    build: .
    image: logboard:latest
    container_name: logboard
    restart: unless-stopped
    ports:
      - "${LB_PUBLISH:-8421}:${LB_PORT:-8421}"
    environment:
      # write token: leave empty to allow anonymous posting
      LB_TOKEN: ${LB_TOKEN:-}
      # everything below is optional; defaults shown in comments
      # LB_PENDING_DAYS: "10"      # unassigned targets live this long
      # LB_MAX_BODY: 8mb           # largest single posted message
      # LB_SWEEP_MINUTES: "15"     # expiry/retention sweep interval
      # LB_RETENTION_DAYS: "0"     # 0 = keep messages forever
    volumes:
      - lb_data:/app/data

volumes:
  lb_data:
